; =============================================================================
; HSM Transparent Load Balancer — Supervisor Configuration
; =============================================================================
; Deploy to : /etc/supervisor/conf.d/hsm-lb.conf
; Reload    : supervisorctl reread && supervisorctl update
; Start     : supervisorctl start hsm-lb-1
; Stop      : supervisorctl stop hsm-lb-1
; Status    : supervisorctl status
; =============================================================================

[program:hsm-lb-1]
command=/usr/bin/java
    -Xms1g -Xmx2g
    -XX:+UseG1GC
    -Djava.awt.headless=true
    -jar /opt/hsm-lb/bin/thales-transparent-lb.jar
    --spring.config.location=/opt/hsm-lb/config/lb-1/application.properties
environment=JAVA_HOME="/usr/bin/java"
directory=/opt/hsm-lb
user=hsm-lb
autostart=true
autorestart=true
startretries=5
startsecs=20
stopwaitsecs=30
redirect_stderr=false
stdout_logfile=/var/log/hsm-lb/lb-1.log
stdout_logfile_maxbytes=100MB
stdout_logfile_backups=10
stderr_logfile=/var/log/hsm-lb/lb-1-err.log
stderr_logfile_maxbytes=20MB
stderr_logfile_backups=5

[program:hsm-lb-2]
command=/usr/bin/java
    -Xms1g -Xmx2g
    -XX:+UseG1GC
    -Djava.awt.headless=true
    -jar /opt/hsm-lb/bin/thales-transparent-lb.jar
    --spring.config.location=/opt/hsm-lb/config/lb-2/application.properties
environment=JAVA_HOME="/usr/bin/java"
directory=/opt/hsm-lb
user=hsm-lb
autostart=true
autorestart=true
startretries=5
startsecs=20
stopwaitsecs=30
redirect_stderr=false
