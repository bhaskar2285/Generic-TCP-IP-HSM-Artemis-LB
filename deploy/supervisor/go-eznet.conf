; =============================================================================
; Go EZNet TCP-AMQP Bridge — Supervisor Configuration
; =============================================================================
; Deploy to : /etc/supervisor/conf.d/go-eznet.conf
; Binary    : /opt/hsm-lb/bin/go-eznet  (built from go-eznet/ source)
; Reload    : supervisorctl reread && supervisorctl update
; =============================================================================

[program:go-eznet-1]
command=/opt/hsm-lb/bin/go-eznet
    -tcp-port=9110
    -metrics-port=8130
    -broker=amqp://ARTEMIS_MASTER:61618
    -broker2=amqp://ARTEMIS_SLAVE:61618
    -self-queue=hsm-transparent-lb-inbound-go-1
    -outbound-queue=hsm.transparent.lb.in
    -max-conn=2000
    -read-timeout=30s
    -log-file=/var/log/hsm-lb/go-eznet-1.log
directory=/opt/hsm-lb
user=hsm-lb
autostart=true
autorestart=true
startretries=5
startsecs=5
stopwaitsecs=10
redirect_stderr=false
stdout_logfile=/var/log/hsm-lb/go-eznet-1.log
stdout_logfile_maxbytes=100MB
stdout_logfile_backups=10
stderr_logfile=/var/log/hsm-lb/go-eznet-1-err.log
stderr_logfile_maxbytes=20MB
stderr_logfile_backups=5

