# Prometheus scrape config for Docker-based monitoring stack
# Targets use host.docker.internal to reach services on the host
# Replace _HOST placeholders with actual IPs if on separate servers

global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:

  - job_name: hsm-lb
    static_configs:
      - targets:
          - host.docker.internal:8110
          - host.docker.internal:8111
    metrics_path: /actuator/prometheus

  - job_name: artemis
    static_configs:
      - targets:
          - ARTEMIS_MASTER:9404
          - ARTEMIS_SLAVE:9404

  - job_name: go-eznet
    static_configs:
      - targets:
          - host.docker.internal:8130
          - host.docker.internal:8131
          - host.docker.internal:8132
          - host.docker.internal:8133
          - host.docker.internal:8134
    metrics_path: /metrics

  - job_name: cadvisor
    static_configs:
      - targets:
          - cadvisor:8080

  - job_name: node
    static_configs:
      - targets:
          - host.docker.internal:9100
